<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joga Motion — Crea tu video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="studio.css">
  <script src="studio.js" defer></script>
</head>
<body>
  <header class="nav"><a class="brand" href="index.html"><span class="brand-icon" aria-hidden="true">▶</span>Joga <strong>Motion</strong></a><button id="language" type="button">English</button></header>
  <main>
    <header class="intro hero">
      <div class="hero-copy"><span class="eyebrow" data-copy="eyebrow"></span><h1 data-copy="title"></h1><p data-copy="subtitle"></p><a class="hero-action" href="#createStudio" data-copy="heroAction"></a></div>
      <img class="hero-image" src="joga-motion-brand-hero.jpg" width="1672" height="941" alt="Un libro se transforma en una aventura cinematográfica entre montañas">
    </header>
    <div class="studio" id="createStudio">
      <section class="editor" aria-labelledby="photosTitle">
        <div class="section-title"><h2 id="photosTitle"><span>01</span> <span data-copy="photos"></span></h2><span id="photoCount">0 / 8</span></div>
        <button type="button" id="upload" class="upload"><span class="upload-icon" aria-hidden="true">＋</span><strong data-copy="upload"></strong><span data-copy="formats"></span></button>
        <input type="file" id="photos" accept="image/jpeg,image/png,image/webp" hidden>
        <div id="thumbnails" class="thumbnails"></div>
        <p class="hint" data-copy="referenceHint"></p>
        <label class="section-title prompt-title" for="description"><span class="label"><span>02</span> <span data-copy="description"></span></span></label>
        <textarea id="description" maxlength="1800" rows="5"></textarea>
        <div class="examples" id="examples"></div>
        <div class="create-row"><span class="video-spec" data-copy="spec"></span><button id="create" type="button" class="primary" disabled></button></div>
        <p class="cost-note" data-copy="cost"></p>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </section>
      <section class="preview" aria-labelledby="previewTitle">
        <div class="section-title"><h2 id="previewTitle" data-copy="preview"></h2><span class="preview-tag" data-copy="previewTag"></span></div>
        <div class="preview-screen">
          <div id="emptyPreview" class="empty-preview"><div class="film-icon" aria-hidden="true">▷</div><h3 data-copy="emptyTitle"></h3><p data-copy="emptyText"></p></div>
          <div id="progress" class="progress" hidden><span class="spinner" aria-hidden="true"></span><h3 id="progressTitle"></h3><p data-copy="progressNote"></p></div>
          <video id="video" controls playsinline hidden></video>
        </div>
        <div class="preview-footer"><p data-copy="previewHint"></p><a id="download" class="primary" hidden data-copy="download"></a></div>
      </section>
    </div>
    <p class="footer-note" data-copy="footer"></p>
  </main>
</body>
</html>
