<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joga Motion — Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Space+Grotesk:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <div class="pip"></div>
    <span class="joga">Joga</span><span class="motion">Motion</span>
  </a>
  <div class="nav-right">
    <button id="lang-toggle" onclick="toggleLang()">EN</button>
  </div>
</nav>

<!-- CREATOR HERO -->
<div class="page-creator">
  <div class="creator-hero">
    <div class="creator-hero-bg"></div>
    <h1 class="creator-title">Joga <span>Motion</span> Creator</h1>
    <p class="creator-sub" data-t="c_sub"></p>
  </div>

  <!-- LAYOUT -->
  <div class="creator-body">

    <!-- LEFT: Upload -->
    <div class="upload-col">
      <div class="upload-zone" id="uploadZone" onclick="triggerUpload()" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <div class="u-icon">↑</div>
        <p class="u-hint" data-t="c_upload_hint"></p>
        <p class="u-sub" data-t="c_upload_sub"></p>
        <img class="u-preview" id="previewImg" style="display:none" alt="preview" />
        <span class="u-badge" id="imgBadge" style="display:none" data-t="c_img_ready"></span>
        <button class="u-change" id="changeBtn" style="display:none" data-t="c_change" onclick="event.stopPropagation(); triggerUpload()"></button>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)" />

      <!-- Quick prompts -->
      <div style="display:flex;flex-direction:column;gap:8px">
        <p style="font-size:.66rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)" data-t="c_quick_label"></p>
        <div style="display:flex;flex-wrap:wrap;gap:8px" id="quickPrompts"></div>
      </div>
    </div>

    <!-- RIGHT: Controls -->
    <div class="ctrl-panel">

      <!-- Prompt -->
      <div class="ctrl-box">
        <p class="ctrl-label" data-t="c_prompt_label"></p>
        <textarea class="ctrl-textarea" id="promptInput" rows="4" data-t-attr="placeholder" data-t="c_prompt_ph"></textarea>
      </div>

      <!-- Motion Style -->
      <div class="ctrl-box">
        <p class="ctrl-label" data-t="c_style_label"></p>
        <div class="style-grid" id="styleGrid">
          <button class="s-btn on" data-style="cinematic" data-t="s_cinematic"></button>
          <button class="s-btn" data-style="smooth" data-t="s_smooth"></button>
          <button class="s-btn" data-style="dynamic" data-t="s_dynamic"></button>
          <button class="s-btn" data-style="dreamy" data-t="s_dreamy"></button>
          <button class="s-btn" data-style="zoom" data-t="s_zoom"></button>
          <button class="s-btn" data-style="pan" data-t="s_pan"></button>
        </div>
      </div>

      <!-- Duration -->
      <div class="ctrl-box">
        <p class="ctrl-label" data-t="c_dur_label"></p>
        <div class="dur-row">
          <button class="d-btn on" data-dur="5" data-t="c_dur_5"></button>
          <button class="d-btn" data-dur="10" data-t="c_dur_10"></button>
        </div>
      </div>

      <!-- Intensity -->
      <div class="ctrl-box">
        <p class="ctrl-label" data-t="c_intensity_label"></p>
        <div class="slider-wrap">
          <span class="sl-label" data-t="c_int_low"></span>
          <input type="range" class="intensity" id="intensitySlider" min="1" max="10" value="5" oninput="updateSlider(this)" />
          <span class="sl-label" style="text-align:right" data-t="c_int_high"></span>
        </div>
      </div>

      <!-- Generate -->
      <button class="btn-gen" id="genBtn" onclick="generateVideo()">
        <span data-t="c_generate"></span>
      </button>

    </div>

    <!-- PROGRESS (full width) -->
    <div class="prog-panel" id="progPanel">
      <div class="prog-spinner"></div>
      <p class="prog-label" data-t="c_prog_label"></p>
      <h3 class="prog-title" data-t="c_prog_title"></h3>
      <div class="prog-bar-bg"><div class="prog-bar" id="progBar"></div></div>
      <p class="prog-step" id="progStep"></p>
    </div>

    <!-- RESULT (full width) -->
    <div class="result-panel" id="resultPanel" style="position:relative">
      <p class="result-tag" data-t="c_result_tag"></p>
      <h3 class="result-title" data-t="c_result_title"></h3>
      <div class="result-video-wrap">
        <video id="resultVideo" controls autoplay loop style="width:100%;display:block"></video>
      </div>
      <div class="result-actions">
        <button class="btn-dl" id="dlBtn" onclick="downloadVideo()" data-t="c_download"></button>
        <button class="btn-again" onclick="resetCreator()" data-t="c_new"></button>
      </div>
    </div>

  </div>
</div>

<!-- Error toast -->
<div class="toast" id="toast"></div>

<script src="i18n.js"></script>
